name = "scouting-local"
main = "src/index.ts"
compatibility_date = "2026-05-17"

[[services]]
binding = "G3ID"
service = "g3id"

[[d1_databases]]
binding = "SCOUTING_DB"
database_name = "g3-scouting-local"
database_id = "00000000-0000-0000-0000-000000000002"
migrations_dir = "src/db/migrations"

[[r2_buckets]]
binding = "FIELD_MAPS"
bucket_name = "g3-scouting"

[vars]
FRONTEND_URL = "http://localhost:5182"
LOCAL_AUTH_BYPASS = "true"
