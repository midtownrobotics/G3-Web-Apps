# /run is cleared on boot; recreate the dnsmasq query log directory.
# setgid + group g3-edge so new log files are readable by the agent.
d /run/g3-edge-dns 2750 dnsmasq g3-edge -
# The agent's generated dnsmasq config (blocklists, DNS hardening). Must exist
# before dnsmasq starts, since lan.conf includes it with conf-dir.
d /var/lib/g3-edge/dnsmasq 0750 g3-edge g3-edge -
