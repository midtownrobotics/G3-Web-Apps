#!/usr/sbin/nft -f

flush ruleset
table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    iif lo accept
    iifname "lan0" accept
    iifname "wan0" tcp dport 22 accept  # TEMP: remove before going live
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    iifname "lan0" oifname "wan0" accept
  }
}
table ip nat {
  chain postrouting {
    type nat hook postrouting priority 100;
    oifname "wan0" masquerade
  }
}

# Byte counters read by the g3-edge agent. Only the agent reads these; it
# also deletes idle entries from the flows_* sets.
table inet acct {
  # Per LAN client.
  set dl { type ipv4_addr; size 1024; flags dynamic; }
  set ul { type ipv4_addr; size 1024; flags dynamic; }
  # Per (LAN client . remote IP), for per-site stats. The timeout is a safety
  # net; the agent assumes it is at least 1h.
  set flows_dl { type ipv4_addr . ipv4_addr; size 65535; flags dynamic, timeout; timeout 1h; }
  set flows_ul { type ipv4_addr . ipv4_addr; size 65535; flags dynamic, timeout; timeout 1h; }
  chain count {
    type filter hook forward priority -10; policy accept;
    iifname "wan0" oifname "lan0" update @dl { ip daddr counter }
    iifname "lan0" oifname "wan0" update @ul { ip saddr counter }
    iifname "wan0" oifname "lan0" update @flows_dl { ip daddr . ip saddr counter }
    iifname "lan0" oifname "wan0" update @flows_ul { ip saddr . ip daddr counter }
  }
}
