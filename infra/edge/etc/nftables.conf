#!/usr/sbin/nft -f

flush ruleset
table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    iif lo accept
    iifname "lan0" accept
    iifname "wan0" tcp dport 22 accept  # TEMP: remove before going live
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    iifname "lan0" oifname "wan0" accept
  }
}
table ip nat {
  chain postrouting {
    type nat hook postrouting priority 100;
    oifname "wan0" masquerade
  }
}

table inet acct {
  set dl { type ipv4_addr; size 1024; flags dynamic; }
  set ul { type ipv4_addr; size 1024; flags dynamic; }
  chain count {
    type filter hook forward priority -10; policy accept;
    iifname "wan0" oifname "lan0" update @dl { ip daddr counter }
    iifname "lan0" oifname "wan0" update @ul { ip saddr counter }
  }
}
