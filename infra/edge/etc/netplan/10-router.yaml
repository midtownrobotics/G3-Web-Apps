# Only lan0 is configured here. wan0 (the built-in port) is set up by
# /etc/systemd/network/10-wan0.link and 20-wan0.network: netplan matching it by
# driver was unreliable on this board. In the repo, MACs are placeholders
# (public repo); the real file is infra/edge/local/etc/netplan/10-router.yaml.
network:
  version: 2
  renderer: networkd
  ethernets:
    lan0:
      # The USB gigabit adapter.
      match: { macaddress: "02:00:00:00:00:02" }
      set-name: lan0
      addresses: [192.168.50.1/24]
      ignore-carrier: true
