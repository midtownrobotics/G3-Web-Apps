interface=lan0
bind-dynamic
no-resolv
server=1.1.1.1
server=8.8.8.8
dhcp-range=192.168.50.100,192.168.50.250,12h
dhcp-option=option:router,192.168.50.1
dhcp-option=option:dns-server,192.168.50.1

# Query log for the g3-edge agent's per-site stats. Kept in RAM (/run); the
# directory comes from tmpfiles.d/g3-edge.conf and is rotated by
# logrotate.d/g3-edge-dns. Note: this also moves dnsmasq's other log lines here.
log-queries=extra
log-facility=/run/g3-edge-dns/queries.log
log-async=50

# Blocklists and DNS hardening, generated by the g3-edge agent from the Edge UI.
# g3-edge-dnsmasq.path restarts dnsmasq when it changes. The directory comes
# from tmpfiles.d/g3-edge.conf (dnsmasq won't start if it's missing).
conf-dir=/var/lib/g3-edge/dnsmasq/,*.conf

# The shop drive (served by the g3-edge agent on the LAN only): http://drive.local
# Most devices resolve .local over mDNS (g3-drive-mdns.service); this covers the
# ones that ask regular DNS instead.
address=/drive.local/192.168.50.1
