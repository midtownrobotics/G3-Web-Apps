packages:
  - "apps/*"
  - "workers/*"
  - "packages/*"

# pnpm v10 (Cloudflare Pages CI)
onlyBuiltDependencies:
  - "@biomejs/biome"
  - esbuild
  - sharp
  - workerd

# pnpm v11+ (local)
allowBuilds:
  "@biomejs/biome": true
  core-js: false
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/codemods@0.2.1'
  - '@cloudflare/vite-plugin@2.0.0-beta.sha-ad79608dd'
  - cf@1.0.0-beta.5
