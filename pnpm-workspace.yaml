packages:
  - "apps/*"
  - "workers/*"
  - "packages/*"
  - "devices/*"

# pnpm v10 (Cloudflare Pages CI)
onlyBuiltDependencies:
  - "@biomejs/biome"
  - esbuild
  - sharp
  - workerd

# pnpm v11+ (local)
allowBuilds:
  "@biomejs/biome": true
  core-js: false
  esbuild: true
  sharp: true
  workerd: true
